# aval-svm — defaults shown. AVAL_UPSTREAM_URL / AVAL_LISTEN override.
listen = "127.0.0.1:8899"
upstream_url = "https://api.devnet.solana.com"
commitment = "confirmed"
cache_ttl_ms = 2000
# Programs / ProgramData are refetched after this, so upgrades are picked up.
program_ttl_ms = 60000
recycle_after = 5000
upstream_timeout_ms = 10000
